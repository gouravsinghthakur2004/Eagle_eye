name: Build iOS App (Eagle Eye)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App Binary
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: EagleEye/package-lock.json

      - name: Select Xcode 16+
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true
          xcodebuild -version

      - name: Install JS dependencies
        run: |
          cd EagleEye
          npm ci

      - name: Install CocoaPods
        run: |
          cd EagleEye/ios
          pod install

      - name: Build iOS Simulator App Bundle (Mac)
        run: |
          cd EagleEye/ios
          xcodebuild -workspace EagleEye.xcworkspace \
                     -scheme EagleEye \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     build

      - name: Package Simulator App (.zip)
        run: |
          cd EagleEye/ios/build/Build/Products/Release-iphonesimulator
          zip -r EagleEye-Mac-Simulator.zip EagleEye.app

      - name: Build iOS Archive (.ipa)
        run: |
          cd EagleEye/ios
          xcodebuild archive \
                     -workspace EagleEye.xcworkspace \
                     -scheme EagleEye \
                     -configuration Release \
                     -archivePath build/EagleEye.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package .ipa for iOS Device
        run: |
          cd EagleEye/ios/build/EagleEye.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r EagleEye.app Payload/
          zip -r EagleEye-iOS.ipa Payload

      - name: Upload Mac / Simulator App (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: EagleEye-Mac-Simulator-App
          path: EagleEye/ios/build/Build/Products/Release-iphonesimulator/EagleEye-Mac-Simulator.zip

      - name: Upload iOS (.ipa) Package
        uses: actions/upload-artifact@v4
        with:
          name: EagleEye-iOS-IPA
          path: EagleEye/ios/build/EagleEye.xcarchive/Products/Applications/EagleEye-iOS.ipa
