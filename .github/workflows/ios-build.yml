name: Build iOS App (Eagle Eye)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App Binary
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: EagleEye/package-lock.json

      - name: Install JS dependencies
        run: |
          cd EagleEye
          npm ci

      - name: Install CocoaPods
        run: |
          cd EagleEye/ios
          pod install

      - name: Build iOS Simulator App Bundle
        run: |
          cd EagleEye/ios
          xcodebuild -workspace EagleEye.xcworkspace \
                     -scheme EagleEye \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     build

      - name: Package Simulator App (.zip)
        run: |
          cd EagleEye/ios/build/Build/Products/Release-iphonesimulator
          zip -r EagleEye-Mac-Simulator.zip EagleEye.app

      - name: Upload Mac / Simulator App (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: EagleEye-Mac-Simulator-App
          path: EagleEye/ios/build/Build/Products/Release-iphonesimulator/EagleEye-Mac-Simulator.zip
