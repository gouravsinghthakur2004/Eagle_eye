name: Build Android App (Eagle Eye)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Android Debug APK & AAB Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: EagleEye/package-lock.json

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript Dependencies
        run: |
          cd EagleEye
          npm ci

      - name: Run TypeScript Validation
        run: |
          cd EagleEye
          npx tsc --noEmit

      - name: Build Android Debug APK
        run: |
          cd EagleEye/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EagleEye-Android-Debug-APK
          path: EagleEye/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
